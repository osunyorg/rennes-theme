stages:
  - sandbox
  - production

.trigger:
  image: alpine:3.23
  allow_failure: true
  tags: ["osuny-build"]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  before_script:
    - apk add curl jq 1>/dev/null
  script:
    - >
      curl --request POST --fail --silent --header "PRIVATE-TOKEN: ${GL_API_TOKEN}" "${CI_API_V4_URL}/projects/${PROJECT_ID}/pipeline?ref=main" | jq -r '.status, .name, .web_url'
  variables:
    GIT_STRATEGY: none

sandbox:
  extends: [".trigger"]
  stage: sandbox
  parallel:
    matrix:
      - SANDBOX_PROJECT_ID:
        - 2301 # Sandbox
        - 2318 # Sandbox - ICI Rennes

production:
  extends: [".trigger"]
  stage: production
  parallel:
    matrix:
      - PROJECT_ID:
        - 2333 # Numerique Recherche
        - 2337 # Ici Rennes
        - 2338 # Aides
        - 2339 # Culture Sports
        - 2340 # Dechets
        - 2341 # Demarches
        - 2342 # Economie
        - 2343 # Education Jeunesse
        - 2344 # Environnement Sante
        - 2345 # Logement
        - 2346 # Presse
        - 2347 # Transport
        - 2348 # Metropole