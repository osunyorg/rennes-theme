workflow:
  rules:
    - if: $CI_COMMIT_TAG

stages: ["trigger"]

trigger:
  stage: trigger
  image: alpine:3.23
  allow_failure: false
  tags: ["osuny-build"]
  before_script:
    - apk add curl jq 1>/dev/null
  script:
    - >
      curl --request POST --fail --silent --header "PRIVATE-TOKEN: ${GL_API_TOKEN}" "${CI_API_V4_URL}/projects/${PROJECT_ID}/pipeline?ref=main" | jq -r '.status, .name, .web_url'
  parallel:
    matrix:
      - PROJECT_ID:
        - 2318
        - 2333
        - 2337
        - 2338
        - 2339
        - 2340
        - 2341
        - 2342
        - 2343
        - 2344
        - 2345
        - 2346
        - 2347
        - 2348
  variables:
    GIT_STRATEGY: none

